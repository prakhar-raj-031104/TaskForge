name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch. Without this, pushing three
# commits in a minute burns three full CI runs and you only care about the last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: formatting, vet, build. Runs in seconds and catches the
  # majority of mistakes before anyone waits on the slower jobs.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Caches the module and build caches keyed on go.sum.
          cache: true

      - name: Verify dependencies are tidy
        run: |
          go mod download
          go mod verify
          go mod tidy
          # tidy must be a no-op on a clean tree. If it edits anything, go.mod
          # and go.sum were committed out of date and someone else's build will
          # differ from yours.
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          # gofmt -l lists files needing formatting and exits 0 either way, so
          # the result has to be turned into a failure explicitly.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build both binaries
        run: go build -o /tmp/bin/ ./cmd/api ./cmd/worker

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  # ---------------------------------------------------------------------------
  # Unit tests. No database, so they run everywhere and finish fast.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ---------------------------------------------------------------------------
  # Integration tests against a real PostgreSQL.
  #
  # The queue's correctness lives in SQL - FOR UPDATE SKIP LOCKED, partial
  # unique indexes arbitrating a race, CHECK constraints. A mock would prove
  # only that the mock behaves like the mock, so CI runs the real thing.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        # Without this the test step starts before PostgreSQL accepts
        # connections and fails on a race that has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U taskforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TASKFORGE_TEST_DSN: postgres://taskforge:taskforge@localhost:5432/taskforge?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Apply migrations
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.19.0/migrate.linux-amd64.tar.gz \
            | tar xvz migrate
          ./migrate -path ./migrations -database "$TASKFORGE_TEST_DSN" up

      - name: Integration tests
        run: go test -count=1 -v ./internal/job/postgres/...

      # The race detector on the concurrency-critical packages. This is where a
      # data race in the worker pool or the handler registry is caught, and it
      # is why -race is a separate step: it makes tests several times slower, so
      # it is targeted rather than blanket.
      - name: Race detector
        run: go test -race -count=1 ./internal/worker/... ./internal/job/... ./internal/api/...

  # ---------------------------------------------------------------------------
  # Docker images must actually build. A broken Dockerfile discovered at deploy
  # time is a broken deploy.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            TARGET=${{ matrix.target }}
            VERSION=${{ github.sha }}
          # Not pushed: this job proves the image builds. Publishing belongs in
          # a release workflow with its own credentials and approval.
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
