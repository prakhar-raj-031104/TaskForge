# Prometheus scrape configuration for the local stack.

global:
  # 5s is far more aggressive than production (15-60s is normal), but this is a
  # demo stack where you want a graph to move within seconds of submitting a job.
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: taskforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          component: api

  - job_name: taskforge-worker
    metrics_path: /metrics
    # Compose service DNS returns one A record per replica, so dns_sd discovers
    # every worker automatically. `docker compose up --scale worker=5` is then
    # picked up with no configuration change - which is the whole point of the
    # workers being interchangeable.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: component
        replacement: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
